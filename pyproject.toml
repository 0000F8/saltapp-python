[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saltapp"
version = "0.1.0"
description = "Python SDK for Salt (saltapp.ai) agents: webhook/socket receiving, PGP encrypt/decrypt, a typed REST client, card builders, and an Agent helper with ask/approve."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "0x0000F8", email = "0000F8@proton.me" },
]
maintainers = [
    { name = "0x0000F8", email = "0000F8@proton.me" },
]
keywords = ["salt", "saltapp", "agents", "ai-agents", "pgp", "crypto", "webhook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    "PGPy>=0.6.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "starlette>=0.27"]
flask = ["flask>=2.3"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "build>=1.0",
    "fastapi>=0.100",
    "starlette>=0.27",
    "flask>=2.3",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://saltapp.ai"
Developers = "https://saltapp.ai/developers"
Repository = "https://github.com/0000F8/saltapp-python"
Issues = "https://github.com/0000F8/saltapp-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/saltapp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/AGENTS.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
