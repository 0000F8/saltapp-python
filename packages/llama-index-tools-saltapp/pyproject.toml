[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-saltapp"
version = "0.1.0"
description = "LlamaIndex tool spec for Salt (saltapp.ai): send messages, ask a human-in-the-loop question, request payments/invoices, post cards, and check payment status, in a real Salt chat."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "0x0000F8", email = "0000F8@proton.me" },
]
maintainers = [
    { name = "0x0000F8", email = "0000F8@proton.me" },
]
keywords = ["llama-index", "llamahub", "saltapp", "salt", "agents", "human-in-the-loop", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# LlamaIndex's own CONTRIBUTING.md (as of 2026-09) states new tool packages
# are no longer accepted into the run-llama/llama_index monorepo -- "New
# integrations should be maintained in their own repositories and
# published to PyPI independently." This package follows the existing
# llama-index-tools-<name> naming/metadata convention (see [tool.llamahub]
# below, matching e.g. llama-index-tools-arxiv's shape) as a STANDALONE
# repo/package rather than a monorepo PR. It has no logic of its own:
# saltapp is the single source of truth for the tool spec (see
# saltapp/integrations/llamaindex.py in the parent repo) -- this package
# just gives it the `llama_index.tools.saltapp` import path LlamaHub's
# convention expects.
dependencies = [
    "llama-index-core>=0.14",
    "saltapp[llamaindex]>=0.1.0",
]

[project.urls]
Homepage = "https://saltapp.ai"
Repository = "https://github.com/0000F8/saltapp-python"
Source = "https://github.com/0000F8/saltapp-python/tree/main/packages/llama-index-tools-saltapp"
Issues = "https://github.com/0000F8/saltapp-python/issues"

[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.saltapp"

[tool.llamahub.class_authors]
SaltToolSpec = "0000F8"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
